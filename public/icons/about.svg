<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    "About This Computer" — a little 3D object built out of GLASS PANES.

    The real Liquid Glass lives in backdrop-filter <div>s that Icon.astro renders
    BEHIND this SVG, one per face flagged `data-glass` below. Element TYPE picks
    the treatment (see src/styles/global.css + Icon.astro):
      <rect>  front pane  -> border-radius div w/ the full LiquidButton bevel + ::before specular
      <circle> badge      -> border-radius:50% div w/ the SAME bevel + ::before specular
      <path>  top + side  -> clip-path depth panes (same backdrop glass; this SVG
                             paints their specular sheet + dual-rim bevel, since
                             box-shadow can't follow a clip-path)

    So EVERY face is genuine glass refracting the wallpaper at the same strength,
    each with a bevel — front/badge from CSS, top/side from SVG strokes tuned to
    the same visual weight, so the corners read as continuous beveled glass.

    The FRONT pane and the BADGE pane are left free of painted specular blobs —
    their highlight comes only from the CSS bevel/::before. This SVG paints only:
    faint depth-plane tints, the depth specular sheets + dual rims, the vivid
    screen, slot/vents, the pulsing LED, a faint blue badge tint, and the crisp
    white "i" glyph.

    Geometry: tangent construction (front rect x30 y16 w60 h92 rx10; extrusion
    d=(12,-9), unit (0.8,-0.6)). Top + side depth panes tile the extrusion with
    the ridge (87.07,18.93)->(99.07,9.93) as the shared edge; the SIDE pane runs
    the FULL height down to the bottom connector (98,97)->(86,106), so there is no
    missing wedge at the bottom-right. Concentric radii. SMIL LED pulse only.
  -->
  <defs>
    <linearGradient id="topBody" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#dce5f7"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="sideBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93a1c7"/>
      <stop offset="1" stop-color="#6d7c9a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#7cc4ff"/>
      <stop offset="0.5" stop-color="#2f66e6"/>
      <stop offset="1"   stop-color="#78e4ff"/>
    </linearGradient>
    <linearGradient id="badgeTint" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a9d4ff"/>
      <stop offset="1" stop-color="#3d6fe8"/>
    </linearGradient>
    <!-- specular sheet for the clipped depth panes = the CSS ::before analogue -->
    <linearGradient id="spec" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- dual-rim bevel for the clipped panes, matched to the front CSS bevel weight -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimDark" x1="1" y1="1" x2="0.2" y2="0.1">
      <stop offset="0"   stop-color="#2b3a68" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2b3a68" stop-opacity="0"/>
      <stop offset="1"   stop-color="#2b3a68" stop-opacity="0"/>
    </linearGradient>

    <!-- GLASS FACES (read by Icon.astro; never painted here). back->front:
         side (full height) + top depth panes, then front pane, then badge. -->
    <path   data-glass d="M 87.07 18.93 L 99.07 9.93 A 10 10 0 0 1 102 17 L 102 89 A 10 10 0 0 1 98 97 L 86 106 A 10 10 0 0 0 90 98 L 90 26 A 10 10 0 0 0 87.07 18.93 Z"/>
    <path   data-glass d="M 34 18 A 10 10 0 0 1 40 16 L 80 16 A 10 10 0 0 1 87.07 18.93 L 99.07 9.93 A 10 10 0 0 0 92 7 L 52 7 A 10 10 0 0 0 46 9 Z"/>
    <rect   data-glass x="30" y="16" width="60" height="92" rx="10"/>
    <circle data-glass cx="34" cy="96" r="16"/>

    <clipPath id="screenClip"><rect x="36" y="25" width="48" height="38" rx="4"/></clipPath>
  </defs>

  <!-- ===== DEPTH PANES: faint tint + specular sheet + dual-rim bevel ===== -->
  <!-- SIDE (full height, receding/darker) -->
  <path d="M 87.07 18.93 L 99.07 9.93 A 10 10 0 0 1 102 17 L 102 89 A 10 10 0 0 1 98 97 L 86 106 A 10 10 0 0 0 90 98 L 90 26 A 10 10 0 0 0 87.07 18.93 Z"
        fill="url(#sideBody)" opacity="0.4"/>
  <path d="M 87.07 18.93 L 99.07 9.93 A 10 10 0 0 1 102 17 L 102 89 A 10 10 0 0 1 98 97 L 86 106 A 10 10 0 0 0 90 98 L 90 26 A 10 10 0 0 0 87.07 18.93 Z"
        fill="url(#spec)"/>
  <!-- TOP (catching light/lighter) -->
  <path d="M 34 18 A 10 10 0 0 1 40 16 L 80 16 A 10 10 0 0 1 87.07 18.93 L 99.07 9.93 A 10 10 0 0 0 92 7 L 52 7 A 10 10 0 0 0 46 9 Z"
        fill="url(#topBody)" opacity="0.42"/>
  <path d="M 34 18 A 10 10 0 0 1 40 16 L 80 16 A 10 10 0 0 1 87.07 18.93 L 99.07 9.93 A 10 10 0 0 0 92 7 L 52 7 A 10 10 0 0 0 46 9 Z"
        fill="url(#spec)"/>

  <!-- dual-rim bevel on each depth pane (bright top-left, dark bottom-right) -->
  <path d="M 87.07 18.93 L 99.07 9.93 A 10 10 0 0 1 102 17 L 102 89 A 10 10 0 0 1 98 97 L 86 106 A 10 10 0 0 0 90 98 L 90 26 A 10 10 0 0 0 87.07 18.93 Z"
        fill="none" stroke="url(#rimLight)" stroke-width="1.6"/>
  <path d="M 87.07 18.93 L 99.07 9.93 A 10 10 0 0 1 102 17 L 102 89 A 10 10 0 0 1 98 97 L 86 106 A 10 10 0 0 0 90 98 L 90 26 A 10 10 0 0 0 87.07 18.93 Z"
        fill="none" stroke="url(#rimDark)" stroke-width="1.6"/>
  <path d="M 34 18 A 10 10 0 0 1 40 16 L 80 16 A 10 10 0 0 1 87.07 18.93 L 99.07 9.93 A 10 10 0 0 0 92 7 L 52 7 A 10 10 0 0 0 46 9 Z"
        fill="none" stroke="url(#rimLight)" stroke-width="1.6"/>
  <path d="M 34 18 A 10 10 0 0 1 40 16 L 80 16 A 10 10 0 0 1 87.07 18.93 L 99.07 9.93 A 10 10 0 0 0 92 7 L 52 7 A 10 10 0 0 0 46 9 Z"
        fill="none" stroke="url(#rimDark)" stroke-width="1.6"/>

  <!-- ===== FRONT PANE CONTENT (the pane itself is glass; paint only on it) ===== -->
  <!-- SCREEN: recess -> vivid blue-cyan glass -> top gloss -> inner border -->
  <rect x="34" y="23" width="52" height="42" rx="6" fill="#6f7ca6" opacity="0.32"/>
  <rect x="36" y="25" width="48" height="38" rx="4" fill="url(#screen)" opacity="0.94"/>
  <g clip-path="url(#screenClip)">
    <path d="M 36 25 L 84 25 L 84 33 C 66 42 52 42 36 36 Z" fill="#ffffff" opacity="0.32"/>
  </g>
  <rect x="36.8" y="25.8" width="46.4" height="36.4" rx="3.3" fill="none"
        stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.1"/>

  <!-- floppy slot + vents, etched into the glass (semi-transparent) -->
  <rect x="40" y="69" width="42" height="4" rx="2" fill="#5f6c98" opacity="0.5"/>
  <g fill="#7986ad" opacity="0.45">
    <rect x="58" y="81" width="24" height="2.6" rx="1.3"/>
    <rect x="58" y="87" width="24" height="2.6" rx="1.3"/>
    <rect x="58" y="93" width="24" height="2.6" rx="1.3"/>
  </g>
  <!-- cyan power LED (pulses) -->
  <circle cx="52" cy="98" r="4" fill="#7fd4ff" opacity="0.3"/>
  <circle cx="52" cy="98" r="2.2" fill="#8fe0ff">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== BADGE: pane is beveled glass (CSS). Paint ONLY a faint blue tint +
       the crisp white "i" glyph. NO painted reflection highlights - the specular
       comes from the CSS bevel/::before, exactly like the front pane. ===== -->
  <g>
    <circle cx="34" cy="96" r="16" fill="url(#badgeTint)" opacity="0.34"/>
    <circle cx="34" cy="88.5" r="2.6" fill="#ffffff"/>
    <rect x="31.4" y="92.5" width="5.2" height="12" rx="2.6" fill="#ffffff"/>
  </g>
</svg>
