<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    "Videos"

    The PNG's disc, kept as a disc: one big beveled glass pane (circle) with the
    hub as a second one — the same rect/circle pane pair about.svg uses for its
    tower and badge. The iridescence is two crossed gradient sweeps over the
    data band, never a painted highlight; the dated bare hub becomes a play
    mark, the way about.svg's Finder face became an info badge.
  -->
  <defs>
    <linearGradient id="topBody" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#dce5f7"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="sideBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93a1c7"/>
      <stop offset="1" stop-color="#6d7c9a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#7cc4ff"/>
      <stop offset="0.5" stop-color="#2f66e6"/>
      <stop offset="1"   stop-color="#78e4ff"/>
    </linearGradient>
    <linearGradient id="badgeTint" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a9d4ff"/>
      <stop offset="1" stop-color="#3d6fe8"/>
    </linearGradient>
    <!-- specular sheet for the clipped depth panes = the CSS ::before analogue -->
    <linearGradient id="spec" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- dual-rim bevel for the clipped panes, matched to the front CSS bevel weight -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimDark" x1="1" y1="1" x2="0.2" y2="0.1">
      <stop offset="0"   stop-color="#2b3a68" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2b3a68" stop-opacity="0"/>
      <stop offset="1"   stop-color="#2b3a68" stop-opacity="0"/>
    </linearGradient>
    <!-- the PNG's iridescent disc, kept inside the family's blue-cyan range -->
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#79e6ff"/>
      <stop offset="0.35" stop-color="#7ea8ff"/>
      <stop offset="0.65" stop-color="#c08ef0"/>
      <stop offset="1"    stop-color="#7ff0d8"/>
    </linearGradient>

    <!-- GLASS FACES (read by Icon.astro; never painted here). back -> front. -->
    <circle data-glass cx="62" cy="64" r="44"/>
    <circle data-glass cx="62" cy="64" r="17"/>
  </defs>

  <!-- ===== DATA BAND: two crossed sweeps over the annulus r=17..44, so the disc
       reads iridescent without any painted specular blob ===== -->
  <circle cx="62" cy="64" r="30.5" fill="none" stroke="url(#iris)" stroke-width="27" opacity="0.34"/>
  <circle cx="62" cy="64" r="30.5" fill="none" stroke="url(#screen)" stroke-width="27" opacity="0.2"/>
  <!-- pressed rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.34">
    <circle cx="62" cy="64" r="43" stroke-width="1.4"/>
    <circle cx="62" cy="64" r="21" stroke-width="1.4"/>
  </g>
  <circle cx="62" cy="64" r="17.6" fill="none" stroke="#2b3a68" stroke-opacity="0.2" stroke-width="1.6"/>

  <!-- ===== HUB: its own beveled glass disc (CSS). Paint only the play mark. ===== -->
  <circle cx="62" cy="64" r="17" fill="url(#badgeTint)" opacity="0.3"/>
  <path d="M 57.4 55.6 L 71.4 64 L 57.4 72.4 Z" fill="#ffffff" opacity="0.94"/>

</svg>
