<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    "Blog"

    The PNG's salver of papers, minus the dated hand: the tray stays a wide
    beveled glass pane at the bottom, the front sheet is a second beveled pane,
    and the two sheets fanning out behind are depth panes at about.svg's parity
    (faint tint + url(#spec) sheet + dual rim).
  -->
  <defs>
    <linearGradient id="topBody" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#dce5f7"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="sideBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93a1c7"/>
      <stop offset="1" stop-color="#6d7c9a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#7cc4ff"/>
      <stop offset="0.5" stop-color="#2f66e6"/>
      <stop offset="1"   stop-color="#78e4ff"/>
    </linearGradient>
    <linearGradient id="badgeTint" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a9d4ff"/>
      <stop offset="1" stop-color="#3d6fe8"/>
    </linearGradient>
    <!-- specular sheet for the clipped depth panes = the CSS ::before analogue -->
    <linearGradient id="spec" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- dual-rim bevel for the clipped panes, matched to the front CSS bevel weight -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimDark" x1="1" y1="1" x2="0.2" y2="0.1">
      <stop offset="0"   stop-color="#2b3a68" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2b3a68" stop-opacity="0"/>
      <stop offset="1"   stop-color="#2b3a68" stop-opacity="0"/>
    </linearGradient>

    <!-- GLASS FACES (read by Icon.astro; never painted here). back -> front. -->
    <path data-glass d="M 27 88 L 33 37 L 46 38.5 L 45 88 Z"/>
    <path data-glass d="M 83 88 L 82 38.5 L 95 37 L 101 88 Z"/>
    <rect data-glass x="44" y="30" width="40" height="58" rx="5"/>
    <rect data-glass x="18" y="88" width="92" height="12" rx="6"/>
  </defs>

  <!-- ===== THE FANNED SHEETS BEHIND: depth panes, at about.svg's parity ===== -->
  <path d="M 27 88 L 33 37 L 46 38.5 L 45 88 Z"
        fill="url(#topBody)" opacity="0.42"/>
  <path d="M 27 88 L 33 37 L 46 38.5 L 45 88 Z"
        fill="url(#spec)"/>
  <path d="M 83 88 L 82 38.5 L 95 37 L 101 88 Z"
        fill="url(#topBody)" opacity="0.42"/>
  <path d="M 83 88 L 82 38.5 L 95 37 L 101 88 Z"
        fill="url(#spec)"/>
  <path d="M 27 88 L 33 37 L 46 38.5 L 45 88 Z"
        fill="none" stroke="url(#rimLight)" stroke-width="1.6"/>
  <path d="M 27 88 L 33 37 L 46 38.5 L 45 88 Z"
        fill="none" stroke="url(#rimDark)" stroke-width="1.6"/>
  <path d="M 83 88 L 82 38.5 L 95 37 L 101 88 Z"
        fill="none" stroke="url(#rimLight)" stroke-width="1.6"/>
  <path d="M 83 88 L 82 38.5 L 95 37 L 101 88 Z"
        fill="none" stroke="url(#rimDark)" stroke-width="1.6"/>

  <!-- ===== THE FRONT SHEET: the post itself ===== -->
  <rect x="49" y="37" width="15" height="15" rx="3" fill="url(#screen)" opacity="0.94"/>
  <rect x="49.8" y="37.8" width="13.4" height="13.4" rx="2.3" fill="none"
        stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.1"/>
  <rect x="67" y="38.5" width="12" height="3.4" rx="1.7" fill="#5f6c98" opacity="0.5"/>
  <g fill="#7986ad" opacity="0.45">
    <rect x="67" y="46" width="12" height="3" rx="1.5"/>
    <rect x="49" y="59" width="30" height="3" rx="1.5"/>
    <rect x="49" y="66" width="30" height="3" rx="1.5"/>
    <rect x="49" y="73" width="30" height="3" rx="1.5"/>
    <rect x="49" y="80" width="18" height="3" rx="1.5"/>
  </g>

  <!-- ===== THE TRAY: a beveled glass pane, carrying only its own etched groove ===== -->
  <rect x="26" y="92.6" width="76" height="2.4" rx="1.2" fill="#5f6c98" opacity="0.4"/>

</svg>
