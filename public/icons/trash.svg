<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    "Trash"

    The PNG's ribbed metal can with its lid leaning at the right. The bin body
    is a beveled glass pane (rect) and the lid is a second one (circle) — the
    same rect+circle pane pair about.svg uses for its tower and badge, so the
    lid overlaps the bin exactly the way about's badge overlaps its tower.

    No SMIL here: the LED pulse belongs to about.svg alone.
  -->
  <defs>
    <linearGradient id="topBody" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#dce5f7"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="sideBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93a1c7"/>
      <stop offset="1" stop-color="#6d7c9a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#7cc4ff"/>
      <stop offset="0.5" stop-color="#2f66e6"/>
      <stop offset="1"   stop-color="#78e4ff"/>
    </linearGradient>
    <linearGradient id="badgeTint" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a9d4ff"/>
      <stop offset="1" stop-color="#3d6fe8"/>
    </linearGradient>
    <!-- specular sheet for the clipped depth panes = the CSS ::before analogue -->
    <linearGradient id="spec" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- dual-rim bevel for the clipped panes, matched to the front CSS bevel weight -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimDark" x1="1" y1="1" x2="0.2" y2="0.1">
      <stop offset="0"   stop-color="#2b3a68" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2b3a68" stop-opacity="0"/>
      <stop offset="1"   stop-color="#2b3a68" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="binClip"><rect x="17" y="30" width="56" height="76" rx="11"/></clipPath>

    <!-- GLASS FACES (read by Icon.astro; never painted here). back -> front. -->
    <circle data-glass cx="88" cy="82" r="22"/>
    <rect data-glass x="17" y="30" width="56" height="76" rx="11"/>
  </defs>

  <!-- ===== CRUMPLED PAPER poking out of the bin ===== -->
  <path d="M 21 34 C 18 27 23 20 29 22.5 C 30.5 15 39.5 13.5 43.5 19.5 C 48.5 13.5 57 16 58 23 C 65.5 22 71.5 28 68 34 Z"
        fill="#ffffff" opacity="0.6"/>
  <path d="M 21 34 C 18 27 23 20 29 22.5 C 30.5 15 39.5 13.5 43.5 19.5 C 48.5 13.5 57 16 58 23 C 65.5 22 71.5 28 68 34 Z"
        fill="none" stroke="url(#rimLight)" stroke-width="1.4"/>
  <g fill="none" stroke="#2b3a68" stroke-opacity="0.18" stroke-width="1.4" stroke-linecap="round">
    <path d="M 30 24 L 34 32"/>
    <path d="M 44 21 L 42.5 31"/>
    <path d="M 56 25 L 60 32"/>
  </g>

  <!-- ===== BIN: brushed-metal identity tint (faint — the pane is still glass,
       its bevel and ::before sheet come from the CSS) ===== -->
  <rect x="17" y="30" width="56" height="76" rx="11" fill="url(#sideBody)" opacity="0.3"/>
  <g clip-path="url(#binClip)">
    <!-- rolled rim -->
    <rect x="17" y="30" width="56" height="11" fill="#dce5f7" opacity="0.42"/>
    <rect x="17" y="40" width="56" height="2" fill="#2b3a68" opacity="0.3"/>
    <!-- vertical ribs, at about.svg's vent weights -->
    <g fill="#2b3a68" opacity="0.26">
      <rect x="26" y="46" width="2.4" height="54"/>
      <rect x="37" y="46" width="2.4" height="54"/>
      <rect x="48" y="46" width="2.4" height="54"/>
      <rect x="59" y="46" width="2.4" height="54"/>
    </g>
    <g fill="#ffffff" opacity="0.26">
      <rect x="28.4" y="46" width="1.3" height="54"/>
      <rect x="39.4" y="46" width="1.3" height="54"/>
      <rect x="50.4" y="46" width="1.3" height="54"/>
      <rect x="61.4" y="46" width="1.3" height="54"/>
    </g>
  </g>

  <!-- ===== LID leaning against the bin: its own beveled glass disc (CSS).
       Paint only the pressed rings and the handle. ===== -->
  <circle cx="88" cy="82" r="22" fill="url(#sideBody)" opacity="0.22"/>
  <circle cx="88" cy="82" r="15.6" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.6"/>
  <circle cx="88" cy="82" r="15.6" fill="none" stroke="#2b3a68" stroke-opacity="0.16" stroke-width="1.6"
          transform="translate(1,1.4)"/>
  <circle cx="88" cy="82" r="5.2" fill="#dce5f7" opacity="0.5"/>
  <circle cx="88" cy="82" r="5.2" fill="none" stroke="url(#rimLight)" stroke-width="1.3"/>

</svg>
