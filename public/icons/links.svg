<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    "Links"

    The PNG's framed picture with the globe in front of it, minus the dated
    pointing hand. The frame is the beveled front pane, the globe is a second
    beveled pane overlapping it exactly the way about.svg's badge overlaps its
    tower, and the page carries about.svg's recess -> url(#screen) -> gloss ->
    inner-border recipe with a link glyph on it.
  -->
  <defs>
    <linearGradient id="topBody" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#dce5f7"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="sideBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93a1c7"/>
      <stop offset="1" stop-color="#6d7c9a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#7cc4ff"/>
      <stop offset="0.5" stop-color="#2f66e6"/>
      <stop offset="1"   stop-color="#78e4ff"/>
    </linearGradient>
    <linearGradient id="badgeTint" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a9d4ff"/>
      <stop offset="1" stop-color="#3d6fe8"/>
    </linearGradient>
    <!-- specular sheet for the clipped depth panes = the CSS ::before analogue -->
    <linearGradient id="spec" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- dual-rim bevel for the clipped panes, matched to the front CSS bevel weight -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimDark" x1="1" y1="1" x2="0.2" y2="0.1">
      <stop offset="0"   stop-color="#2b3a68" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2b3a68" stop-opacity="0"/>
      <stop offset="1"   stop-color="#2b3a68" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pageClip"><rect x="39" y="25" width="56" height="50" rx="4"/></clipPath>

    <!-- GLASS FACES (read by Icon.astro; never painted here). back -> front. -->
    <circle data-glass cx="42" cy="88" r="22"/>
    <rect data-glass x="34" y="20" width="66" height="60" rx="8"/>
  </defs>

  <!-- ===== FRAMED PAGE: recess -> vivid glass -> gloss -> inner border ===== -->
  <rect x="37" y="23" width="60" height="54" rx="6" fill="#6f7ca6" opacity="0.32"/>
  <rect x="39" y="25" width="56" height="50" rx="4" fill="url(#screen)" opacity="0.94"/>
  <g clip-path="url(#pageClip)">
    <path d="M 39 25 L 95 25 L 95 32 C 76 41 58 41 39 35 Z" fill="#ffffff" opacity="0.28"/>
  </g>
  <!-- the link itself: two interlocking rings -->
  <g transform="rotate(-32 67 47)" fill="none" stroke="#ffffff" stroke-opacity="0.94" stroke-width="3.4">
    <rect x="52" y="41" width="19" height="12" rx="6"/>
    <rect x="63" y="41" width="19" height="12" rx="6"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <rect x="50" y="58" width="36" height="3.2" rx="1.6"/>
    <rect x="50" y="65" width="24" height="3.2" rx="1.6"/>
  </g>
  <rect x="39.8" y="25.8" width="54.4" height="48.4" rx="3.3" fill="none"
        stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.1"/>

  <!-- ===== GLOBE: its own beveled glass sphere (CSS). Paint only the graticule. ===== -->
  <circle cx="42" cy="88" r="22" fill="url(#badgeTint)" opacity="0.32"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.82" stroke-width="1.8" stroke-linecap="round">
    <circle cx="42" cy="88" r="16.4"/>
    <ellipse cx="42" cy="88" rx="7.2" ry="16.4"/>
    <path d="M 25.6 88 L 58.4 88"/>
    <path d="M 29.4 79 Q 42 84.6 54.6 79"/>
    <path d="M 29.4 97 Q 42 102.6 54.6 97"/>
  </g>

</svg>
