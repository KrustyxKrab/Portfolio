<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    "Education"

    MODULE: BOX — about.svg's tangent extrusion (front rect x=24 y=35 w=68 h=68
    rx=8, d=(12,-9)). The PNG's row of standing books is ONE extruded block, so
    no two glass panes ever overlap: the individual bindings are painted onto
    the front pane as identity tints, and the gaps between them are carried
    across the top face parallel to the extrusion so the row still reads 3D.
  -->
  <defs>
    <linearGradient id="topBody" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#dce5f7"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="sideBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93a1c7"/>
      <stop offset="1" stop-color="#6d7c9a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#7cc4ff"/>
      <stop offset="0.5" stop-color="#2f66e6"/>
      <stop offset="1"   stop-color="#78e4ff"/>
    </linearGradient>
    <linearGradient id="badgeTint" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a9d4ff"/>
      <stop offset="1" stop-color="#3d6fe8"/>
    </linearGradient>
    <!-- specular sheet for the clipped depth panes = the CSS ::before analogue -->
    <linearGradient id="spec" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- dual-rim bevel for the clipped panes, matched to the front CSS bevel weight -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimDark" x1="1" y1="1" x2="0.2" y2="0.1">
      <stop offset="0"   stop-color="#2b3a68" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2b3a68" stop-opacity="0"/>
      <stop offset="1"   stop-color="#2b3a68" stop-opacity="0"/>
    </linearGradient>
    <!-- the PNG's violet bindings, kept faint so the panes stay glass -->
    <linearGradient id="bindA" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#a9b6f5"/>
      <stop offset="1" stop-color="#4051c8"/>
    </linearGradient>
    <linearGradient id="bindB" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#cbaaf5"/>
      <stop offset="1" stop-color="#7a3fc8"/>
    </linearGradient>
    <clipPath id="rowClip"><rect x="24" y="35" width="68" height="68" rx="8"/></clipPath>

    <!-- GLASS FACES (read by Icon.astro; never painted here). back -> front. -->
    <path data-glass d="M 89.66 37.34 L 101.66 28.34 A 8 8 0 0 1 104 34 L 104 86 A 8 8 0 0 1 100.8 92.4 L 88.8 101.4 A 8 8 0 0 0 92 95 L 92 43 A 8 8 0 0 0 89.66 37.34 Z"/>
    <path data-glass d="M 27.2 36.6 A 8 8 0 0 1 32 35 L 84 35 A 8 8 0 0 1 89.66 37.34 L 101.66 28.34 A 8 8 0 0 0 96 26 L 44 26 A 8 8 0 0 0 39.2 27.6 Z"/>
    <rect data-glass x="24" y="35" width="68" height="68" rx="8"/>
  </defs>

  <!-- ===== DEPTH PANES: faint tint + specular sheet + dual-rim bevel ===== -->
  <!-- SIDE = the outer book's cover (receding/darker) -->
  <path d="M 89.66 37.34 L 101.66 28.34 A 8 8 0 0 1 104 34 L 104 86 A 8 8 0 0 1 100.8 92.4 L 88.8 101.4 A 8 8 0 0 0 92 95 L 92 43 A 8 8 0 0 0 89.66 37.34 Z"
        fill="url(#sideBody)" opacity="0.4"/>
  <path d="M 89.66 37.34 L 101.66 28.34 A 8 8 0 0 1 104 34 L 104 86 A 8 8 0 0 1 100.8 92.4 L 88.8 101.4 A 8 8 0 0 0 92 95 L 92 43 A 8 8 0 0 0 89.66 37.34 Z"
        fill="url(#spec)"/>
  <path d="M 89.66 37.34 L 101.66 28.34 A 8 8 0 0 1 104 34 L 104 86 A 8 8 0 0 1 100.8 92.4 L 88.8 101.4 A 8 8 0 0 0 92 95 L 92 43 A 8 8 0 0 0 89.66 37.34 Z"
        fill="url(#bindA)" opacity="0.24"/>
  <!-- TOP = the page edges (catching light/lighter) -->
  <path d="M 27.2 36.6 A 8 8 0 0 1 32 35 L 84 35 A 8 8 0 0 1 89.66 37.34 L 101.66 28.34 A 8 8 0 0 0 96 26 L 44 26 A 8 8 0 0 0 39.2 27.6 Z"
        fill="url(#topBody)" opacity="0.42"/>
  <path d="M 27.2 36.6 A 8 8 0 0 1 32 35 L 84 35 A 8 8 0 0 1 89.66 37.34 L 101.66 28.34 A 8 8 0 0 0 96 26 L 44 26 A 8 8 0 0 0 39.2 27.6 Z"
        fill="url(#spec)"/>

  <!-- dual-rim bevel on each depth pane (bright top-left, dark bottom-right) -->
  <path d="M 89.66 37.34 L 101.66 28.34 A 8 8 0 0 1 104 34 L 104 86 A 8 8 0 0 1 100.8 92.4 L 88.8 101.4 A 8 8 0 0 0 92 95 L 92 43 A 8 8 0 0 0 89.66 37.34 Z"
        fill="none" stroke="url(#rimLight)" stroke-width="1.6"/>
  <path d="M 89.66 37.34 L 101.66 28.34 A 8 8 0 0 1 104 34 L 104 86 A 8 8 0 0 1 100.8 92.4 L 88.8 101.4 A 8 8 0 0 0 92 95 L 92 43 A 8 8 0 0 0 89.66 37.34 Z"
        fill="none" stroke="url(#rimDark)" stroke-width="1.6"/>
  <path d="M 27.2 36.6 A 8 8 0 0 1 32 35 L 84 35 A 8 8 0 0 1 89.66 37.34 L 101.66 28.34 A 8 8 0 0 0 96 26 L 44 26 A 8 8 0 0 0 39.2 27.6 Z"
        fill="none" stroke="url(#rimLight)" stroke-width="1.6"/>
  <path d="M 27.2 36.6 A 8 8 0 0 1 32 35 L 84 35 A 8 8 0 0 1 89.66 37.34 L 101.66 28.34 A 8 8 0 0 0 96 26 L 44 26 A 8 8 0 0 0 39.2 27.6 Z"
        fill="none" stroke="url(#rimDark)" stroke-width="1.6"/>

  <!-- ===== FRONT PANE: three bindings side by side. Identity tints only —
       no painted specular, the bevel comes from the CSS. ===== -->
  <g clip-path="url(#rowClip)">
    <rect x="24" y="35" width="23" height="68" fill="url(#bindA)" opacity="0.38"/>
    <rect x="47" y="35" width="22" height="68" fill="url(#bindB)" opacity="0.44"/>
    <rect x="69" y="35" width="23" height="68" fill="url(#bindA)" opacity="0.3"/>
  </g>

  <!-- the gaps between the bindings, carried across the page edges above -->
  <g fill="#2b3a68" opacity="0.3">
    <rect x="45.8" y="35" width="2.4" height="68"/>
    <rect x="67.8" y="35" width="2.4" height="68"/>
  </g>
  <g fill="#ffffff" opacity="0.38">
    <rect x="48.2" y="35" width="1.1" height="68"/>
    <rect x="70.2" y="35" width="1.1" height="68"/>
  </g>
  <g fill="none" stroke="#2b3a68" stroke-opacity="0.28" stroke-width="2.4">
    <path d="M 47 35 L 59 26"/>
    <path d="M 69 35 L 81 26"/>
  </g>

  <!-- spine labels -->
  <g fill="#ffffff" opacity="0.36">
    <rect x="28" y="50" width="15" height="26" rx="2.5"/>
    <rect x="50.5" y="50" width="15" height="26" rx="2.5"/>
    <rect x="73" y="50" width="15" height="26" rx="2.5"/>
  </g>
  <g fill="#3b4a7a" opacity="0.42">
    <rect x="31" y="57" width="9" height="2.4" rx="1.2"/>
    <rect x="31" y="64" width="6" height="2.4" rx="1.2"/>
    <rect x="53.5" y="57" width="9" height="2.4" rx="1.2"/>
    <rect x="53.5" y="64" width="6" height="2.4" rx="1.2"/>
    <rect x="76" y="57" width="9" height="2.4" rx="1.2"/>
    <rect x="76" y="64" width="6" height="2.4" rx="1.2"/>
  </g>

</svg>
