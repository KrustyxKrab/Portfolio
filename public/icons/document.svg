<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    "Document"

    MODULE: SHEET — shared verbatim with document.svg, readme.svg, clipping.svg,
    llms-txt.svg, sticky.svg and contact.svg. The sheet is ONE beveled glass pane;
    the LiquidButton bevel + ::before specular come from the CSS, so this SVG
    paints no specular blob and no body fill on it. Shared geometry:
      front pane   <rect data-glass x="28" y="14" width="72" height="100" rx="9"/>
      fold flap    M 78 14 L 78 36 L 100 36 Z      (dog-ear, f=22, reflected corner)
      crease       M 78 14 L 100 36
    Only the GLYPH block below differs between family members.

    GLYPH: the PNG's wax seal, ruled text and inline figure — the seal and the
    figure are the vivid url(#screen) accents, the text sits at about.svg's
    slot/vent weights.
  -->
  <defs>
    <linearGradient id="topBody" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#dce5f7"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="sideBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93a1c7"/>
      <stop offset="1" stop-color="#6d7c9a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#7cc4ff"/>
      <stop offset="0.5" stop-color="#2f66e6"/>
      <stop offset="1"   stop-color="#78e4ff"/>
    </linearGradient>
    <linearGradient id="badgeTint" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a9d4ff"/>
      <stop offset="1" stop-color="#3d6fe8"/>
    </linearGradient>
    <!-- specular sheet for the clipped depth panes = the CSS ::before analogue -->
    <linearGradient id="spec" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- dual-rim bevel for the clipped panes, matched to the front CSS bevel weight -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimDark" x1="1" y1="1" x2="0.2" y2="0.1">
      <stop offset="0"   stop-color="#2b3a68" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2b3a68" stop-opacity="0"/>
      <stop offset="1"   stop-color="#2b3a68" stop-opacity="0"/>
    </linearGradient>
    <!-- SHEET module: the turned-over back of the folded corner -->
    <linearGradient id="foldFace" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#c9d6ef" stop-opacity="0.34"/>
    </linearGradient>

    <!-- GLASS FACES (read by Icon.astro; never painted here) -->
    <rect data-glass x="28" y="14" width="72" height="100" rx="9"/>
  </defs>

  <!-- ===== SHEET MODULE: dog-eared corner (f=22) ===== -->
  <path d="M 78 14 L 78 36 L 100 36 Z" fill="url(#foldFace)"/>
  <path d="M 78 14 L 78 36 L 100 36 Z" fill="none" stroke="url(#rimLight)" stroke-width="1.3"/>
  <path d="M 78 14 L 100 36" fill="none" stroke="#2b3a68" stroke-opacity="0.22" stroke-width="1.1"/>

  <!-- ===== GLYPH: the document's own marks ===== -->
  <!-- seal, top-left (the old wax stamp, now a vivid glass chip) -->
  <circle cx="49" cy="34" r="10" fill="url(#screen)" opacity="0.94"/>
  <circle cx="49" cy="34" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.1"/>
  <path d="M 49 28.6 L 50.7 32.2 L 54.6 32.7 L 51.8 35.5 L 52.5 39.4 L 49 37.5 L 45.5 39.4 L 46.2 35.5 L 43.4 32.7 L 47.3 32.2 Z"
        fill="#ffffff" opacity="0.92"/>

  <!-- ruled text, at about.svg's slot/vent weights -->
  <rect x="39" y="54" width="48" height="3.6" rx="1.8" fill="#5f6c98" opacity="0.5"/>
  <g fill="#7986ad" opacity="0.45">
    <rect x="39" y="63" width="48" height="3" rx="1.5"/>
    <rect x="39" y="71" width="36" height="3" rx="1.5"/>
  </g>

  <!-- inline figure + its caption lines -->
  <rect x="39" y="82" width="22" height="22" rx="4" fill="url(#screen)" opacity="0.94"/>
  <rect x="39.8" y="82.8" width="20.4" height="20.4" rx="3.3" fill="none"
        stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.1"/>
  <g fill="#7986ad" opacity="0.45">
    <rect x="67" y="85" width="21" height="3" rx="1.5"/>
    <rect x="67" y="93" width="21" height="3" rx="1.5"/>
    <rect x="67" y="101" width="13" height="3" rx="1.5"/>
  </g>
</svg>
